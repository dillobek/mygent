<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" width="1120" height="1000" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#16336F"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000A22" flood-opacity="0.45"/></filter>
<clipPath id="scr"><rect x="350" y="130" width="380" height="780" rx="40"/></clipPath>
</defs>
<rect width="1120" height="1000" rx="48" fill="#071B45"/>
<rect width="1120" height="1000" rx="48" fill="url(#dots)"/>
<circle cx="560" cy="520" r="360" fill="#0A68F5" opacity="0.16"/>
<path d="M960 70C964 104 980 120 1014 124C980 128 964 144 960 178C956 144 940 128 906 124C940 120 956 104 960 70Z" fill="#2AD6C9"/>
<path d="M120 860C122 878 130 886 148 888C130 890 122 898 120 916C118 898 110 890 92 888C110 886 118 878 120 860Z" fill="#2AD6C9" opacity="0.7"/>

<!-- phone -->
<g filter="url(#sh)">
<rect x="330" y="110" width="420" height="820" rx="58" fill="#0B1F4D" stroke="#24407E" stroke-width="3"/>
</g>
<g clip-path="url(#scr)">
<rect x="350" y="130" width="380" height="780" fill="#F4F8FF"/>
<rect x="350" y="130" width="380" height="104" fill="#FFFFFF"/>
<rect x="350" y="233" width="380" height="1" fill="#DCE5F5"/>
<rect x="372" y="158" width="52" height="52" rx="14" fill="#071B45"/>
