<path d="M20 1.5C20.8 5.5 22.5 7.2 26.5 8C22.5 8.8 20.8 10.5 20 14.5C19.2 10.5 17.5 8.8 13.5 8C17.5 7.2 19.2 5.5 20 1.5Z" fill="#2AD6C9"/>
<rect x="4" y="16" width="9" height="22" rx="4.5" fill="#FFFFFF"/>
<rect x="27" y="16" width="9" height="22" rx="4.5" fill="#FFFFFF"/>
<path d="M8.5 20.5L20 29L31.5 20.5" fill="none" stroke="#0A68F5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="440" y="182" font-size="22" font-weight="700" fill="#071B45">MedAgent</text>
<circle cx="446" cy="200" r="5" fill="#2AD6C9"/>
<text x="458" y="206" font-size="16" fill="#4A5878">onlayn</text>

<!-- msg 1 incoming -->
<rect x="372" y="262" width="276" height="104" rx="20" fill="#FFFFFF" stroke="#DCE5F5"/>
<text x="392" y="296" font-size="18" fill="#071B45">Assalomu alaykum! Bolam</text>
<text x="392" y="322" font-size="18" fill="#071B45">yo'talyapti, qabulga yozilsa</text>
<text x="392" y="348" font-size="18" fill="#071B45">bo'ladimi?</text>
<!-- msg 2 agent -->
<rect x="424" y="386" width="284" height="104" rx="20" fill="#0A68F5"/>
<text x="444" y="420" font-size="18" fill="#FFFFFF">Va alaykum assalom! Ertaga</text>
<text x="444" y="446" font-size="18" fill="#FFFFFF">10:00 yoki 15:00 bo'sh.</text>
<text x="444" y="472" font-size="18" fill="#FFFFFF">Qaysi biri qulay?</text>
<!-- msg 3 incoming -->
<rect x="372" y="510" width="168" height="52" rx="20" fill="#FFFFFF" stroke="#DCE5F5"/>
<text x="392" y="543" font-size="18" fill="#071B45">15:00 bo'lsin</text>
<!-- msg 4 agent -->
<rect x="424" y="582" width="284" height="104" rx="20" fill="#0A68F5"/>
<text x="444" y="616" font-size="18" fill="#FFFFFF">Yozib qo'ydim. Shifokor</text>
<text x="444" y="642" font-size="18" fill="#FFFFFF">tasdiqlagach eslatma</text>
<text x="444" y="668" font-size="18" fill="#FFFFFF">yuboraman.</text>
<!-- typing -->
<rect x="372" y="706" width="84" height="44" rx="20" fill="#FFFFFF" stroke="#DCE5F5"/>
<circle cx="396" cy="728" r="5" fill="#9FB0D3"/><circle cx="414" cy="728" r="5" fill="#9FB0D3"/><circle cx="432" cy="728" r="5" fill="#9FB0D3"/>
<!-- input -->
<rect x="350" y="826" width="380" height="84" fill="#FFFFFF"/>
<rect x="350" y="826" width="380" height="1" fill="#DCE5F5"/>
<rect x="370" y="844" width="284" height="48" rx="24" fill="#F4F8FF" stroke="#DCE5F5"/>
<text x="392" y="874" font-size="17" fill="#6A7896">Xabar yozing...</text>
<circle cx="686" cy="868" r="24" fill="#0A68F5"/>
<path d="M676 868h20M688 860l8 8-8 8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- card: new lead (top right) -->
<g filter="url(#sh)">
<rect x="690" y="200" width="380" height="116" rx="24" fill="#FFFFFF"/>
</g>
<circle cx="742" cy="258" r="28" fill="#DDF8F5"/>
<path d="M729 258l9 9 17-18" fill="none" stroke="#0B7A72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="786" y="250" font-size="20" font-weight="700" fill="#071B45">Yangi ariza qabul qilindi</text>
<text x="786" y="280" font-size="16" fill="#4A5878">Telegram orqali · hozir</text>

<!-- card: approval (left) -->
<g filter="url(#sh)">
<rect x="50" y="520" width="380" height="214" rx="26" fill="#FFFFFF"/>
</g>
<rect x="50" y="520" width="380" height="214" rx="26" fill="none" stroke="#0A68F5" stroke-width="2"/>
<text x="78" y="562" font-size="14" font-weight="700" letter-spacing="1.2" fill="#4A5878">INSTAGRAM POST</text>
<rect x="268" y="542" width="138" height="30" rx="15" fill="#E8F0FF"/>
<text x="337" y="562" font-size="14" font-weight="600" fill="#0A5AD6" text-anchor="middle">Tasdiq kutmoqda</text>
<text x="78" y="602" font-size="21" font-weight="700" fill="#071B45">Bolalarda yo'tal: qachon</text>
<text x="78" y="630" font-size="21" font-weight="700" fill="#071B45">shifokorga borish kerak?</text>
<rect x="78" y="660" width="150" height="48" rx="12" fill="#0A68F5"/>
<text x="153" y="690" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tasdiqlash</text>
<rect x="240" y="660" width="150" height="48" rx="12" fill="#FFFFFF" stroke="#DCE5F5" stroke-width="2"/>
<text x="315" y="690" font-size="17" font-weight="600" fill="#071B45" text-anchor="middle">Tahrirlash</text>

<!-- card: report (bottom right) -->
<g filter="url(#sh)">
<rect x="700" y="760" width="350" height="116" rx="24" fill="#FFFFFF"/>
</g>
<rect x="724" y="788" width="60" height="60" rx="16" fill="#E8F0FF"/>
<path d="M738 836v-14M750 836v-24M762 836v-10M774 836v-18" stroke="#0A68F5" stroke-width="5" stroke-linecap="round"/>
<text x="802" y="812" font-size="20" font-weight="700" fill="#071B45">Haftalik hisobot</text>
<text x="802" y="842" font-size="16" fill="#4A5878">Agent tayyorladi · ko'rish</text>
</svg>
